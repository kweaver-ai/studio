{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "template.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ index .Values.depServices "class-443" "ingressClass" }}
  rules:
  - http:
      paths:
      - backend:
          service:
            name: {{ include "template.fullname" $ }}-service
            port:
              number: 18080
        path: /interface/deployweb
        pathType: Prefix
      - backend:
          service:
            name: {{ include "template.fullname" $ }}-service
            port:
              number: 18080
        path: /api/deploy-web-service
        pathType: Prefix
      - backend:
          service:
            name: {{ include "template.fullname" $ }}-service
            port:
              number: 18080
        path: /api/deployweb
        pathType: Prefix
      - backend:
          service:
            name: {{ include "template.fullname" $ }}-static
            port:
              number: 18800
        path: /deploy
        pathType: Prefix
{{- end }}

---
{{- if semverCompare "<1.19-0" .Capabilities.KubeVersion.GitVersion }}
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: {{ include "template.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ index .Values.depServices "class-443" "ingressClass" }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  rules:
  - http:
      paths:
      - backend:
          serviceName: {{ include "template.fullname" $ }}-service
          servicePort: 18080
        path: /interface/deployweb
      - backend:
          serviceName: {{ include "template.fullname" $ }}-service
          servicePort: 18080
        path: /api/deployweb
      - backend:
          serviceName: {{ include "template.fullname" $ }}-service
          servicePort: 18080
        path: /api/deploy-web-service
      - backend:
          serviceName: {{ include "template.fullname" $ }}-static
          servicePort: 18800
        path: /deploy
      
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-business-system-frontend
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "{{ .Values.ingress.rps.limit }}" # rps：每秒多少请求 超过之后就报错 https status: 503
spec:
  ingressClassName: {{ index .Values.depServices "class-443" "ingressClass" }}
  rules:
    - http:
        paths:
          - backend:
              service:
                name: business-system-frontend
                port:
                  number: 88
            path: /business-system-frontend
            pathType: ImplementationSpecific

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-model-manager-web
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "{{ .Values.ingress.rps.limit }}" # rps：每秒多少请求 超过之后就报错 https status: 503
spec:
  ingressClassName: {{ index .Values.depServices "class-443" "ingressClass" }}
  rules:
    - http:
        paths:
          - backend:
              service:
                name: mf-model-manager-nginx
                port:
                  number: 80
            path: /mf-model-manager
            pathType: ImplementationSpecific
          - backend:
              service:
                name: mf-model-manager
                port:
                  number: 9898
            path: /api/mf-model-manager
            pathType: Prefix
          - backend:
              service:
                name: mf-model-api
                port:
                  number: 9898
            path: /api/mf-model-api
            pathType: Prefix
